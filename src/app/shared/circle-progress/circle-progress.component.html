<div class="progress-wrapper">
    <round-progress 
        [current]="current"
        [max]="10"
        [color]="current < 5 ? 'red' : current < 7 ? 'orange' : 'green' "
        [background]="'#fff'" [radius]="20" [stroke]="5" [semicircle]="false" [rounded]="true"
        [clockwise]="false" [responsive]="false" [duration]="800" [animation]="'easeInOutQuart'"
        [animationDelay]="0" />
        <div class="text">{{current}}</div>
</div>
