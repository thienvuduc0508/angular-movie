<div class="video-popup" [ngClass]="{'visible': show}">
    <div class="opacity-layer" (click)="hidePopup()"></div>
    <div class="video-player">
        <span class="close-btn" (click)="hidePopup()">Close</span>
        <iframe [src]="sanitizerUrl('https://www.youtube.com/embed/'+videoId)"  width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
        <!-- <youtube-player [videoId]="'https://www.youtube.com/watch?v='+videoId" width="100%" height="100%"></youtube-player> -->
    </div>
</div>
